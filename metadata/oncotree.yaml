# Special cohort names. Use one of these as cancer_types. oncotree_column is ignored.
PANCANCER:
  column: oncotreeprimarydisease
  rule: Every model whose primary disease does not contain NON-CANCER.
  exclude_contains:
  - NON-CANCER
  cell_lines: 2003
SOLID:
  column: oncotreeprimarydisease
  rule: Same models as PANCANCER, then drop the primary diseases in exclude_values.
  exclude_contains:
  - NON-CANCER
  exclude_values:
  - Acute Lymphoblastic Leukemia
  - Acute Myeloid Leukemia
  - Acute Myeloid Leukemia transformed from MPN
  - B Acute Lymphoblastic Leukemia
  - Burkitt Lymphoma
  - Chronic Lymphocytic Leukemia
  - Chronic Myelogenous Leukemia
  - Diffuse Large B-Cell Lymphoma
  - Lymphoma
  - Mixed Phenotype Acute Leukemia
  - Plasma Cell Myeloma
  - T Acute Lymphoblastic Leukemia
  cell_lines: 1939
