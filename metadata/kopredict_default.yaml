# Search settings for kopredict.
# Run the defaults with:  kopredict
# Or copy this file, edit it, and run:  kopredict path/to/copy.yaml
# Options:  kopredict --help

# Gene whose CRISPR or RNAi score is the outcome.
target: PRMT5

# crispr or rnai
dataset: rnai

# Cohort matched against oncotree_column. Use a string or a list.
# Allowed values, and what SOLID and PANCANCER include, are in metadata/oncotree.yaml.
# Leave null when cohort_csv is set.
cancer_types: null

# CSV with columns oncotree_column and name.
# A relative path is resolved from the source directory that contains metadata/.
# Leave null when cancer_types is set.
cohort_csv: metadata/oncotree_cohorts_solid.csv

# Model table column compared with cancer_types.
oncotree_column: oncotreeprimarydisease

# Optional background filter on OmicsFull_processed.parquet.gz.
# Each rule is GENE,omics,COLUMN,greater|less|equal,VALUE,true|false.
# Semicolons separate rules. Example:
# KRAS,omics,muthotspot,greater,0,false
# TP53,omics,altered,greater,0,false
# CCNE1,omics,tpmlogp1_zscore,greater,2.5,false
group_options: null

# Folder of prepared parquet files. null uses ./data or KOPREDICT_DATA_DIR.
data_dir: null

# Feature matrix. null uses <data_dir>/final_depmap_features_26Q1.parquet.gz.
features_path: null

# Plots and summaries. null uses <data_dir>/output.
output_dir: null

# Shuffles used to set the p-value and q-value cutoffs.
# The full cohort uses this count. Each later cell-line subset uses it again,
# after features that do not vary in that subset are removed.
n_permutations: 50

# Percentile of the best null p-value and q-value from those shuffles.
# 5 keeps the cutoff at the 5th percentile. A smaller number is stricter.
null_percentile: 5

# How far a sensitive child's mean must fall below its parent cell lines.
# The first step uses the full cohort as the parent. Missing cells are left out.
min_effect_size: -0.2

# Minimum rise of a resistant group's mean above the parent cell lines.
resistance_min_effect_size: 0.2

# Sensitive parent effect size required before a resistant child is added.
# -0.2 matches min_effect_size, so it adds no extra filter.
strong_min_effect_size: -0.2

# Later sensitive-to-sensitive step. The child mean must fall this far below its parent.
child_min_effect_size: -0.1

# Later resistant-to-resistant step. The child mean must rise this far above its parent.
child_resistance_min_effect_size: 0.1

# Parallel shuffle workers. 1 runs them one at a time.
n_jobs: 1

# Oncoplot color scale.
vmin: -1
vmax: 1

# Print the top N features by Wilcoxon p-value. null turns this off.
debug_wilcox: null

# Skip the search when fewer than this many cell lines are essential. 0 disables the check.
min_essential_cell_lines: 1

# Raw score at or below this counts as essential. null means -1 for crispr and -0.5 for rnai.
essentiality_threshold: null

# Feature subsets kept at each later step of the tree. 0 keeps every subset that passes.
max_next_feature_subsets: 5

# Minimum mutant and WT cell lines required after the effect-size filter (each side).
min_group_count: 3

# Jaccard overlap required to put two features in the same group (seed clustering).
jaccard_threshold: 0.8

# Include expression high/low features. They are dropped when false.
keep_expression_features: false

# Include Sanger, Gygi, and RPPA features. They are dropped when false.
keep_proteiomic_features: false
