[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kopredict"
version = "1.0"
description = "kopredict - knockout sensitivity marker prediction from public DepMap inputs"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Shawn Yost"}]
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "fastparquet>=2023.10.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "statsmodels>=0.14",
    "pyoncoprint>=0.2.6",
    "s3fs>=2024.1",
    "openpyxl>=3.1",
    "PyYAML>=6.0",
]

[project.scripts]
kopredict = "cli_impl:main"
kopredict-download = "download:main"
kopredict-prepare = "prepare:main"

[project.optional-dependencies]
dev = ["pytest", "black", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "background",
    "cli",
    "cli_impl",
    "cohort_summary",
    "database",
    "download",
    "features",
    "local_data",
    "log",
    "permutation",
    "pipeline",
    "plotting",
    "prepare",
    "sources",
    "utils",
]

# Installed under the environment prefix so metadata/oncotree_cohorts_solid.csv
# still resolves after pip install.
[tool.setuptools.data-files]
metadata = ["metadata/*.csv", "metadata/*.yaml"]
"metadata/bundled_inputs" = ["metadata/bundled_inputs/*"]
